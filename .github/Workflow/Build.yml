name: Build mod
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.12
      - name: Build
        run: |
          unzip villager-trade-button.zip
          cd villager-trade-button
          gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: mod
          path: villager-trade-button/build/libs/*.jar
